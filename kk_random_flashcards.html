<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>KK音标随机闪卡</title>
<style>
  :root{
    --bg:#e8f0df;
    --bg2:#dbe7d0;
    --text:#2d302b;
    --muted:#5e6759;
    --btn:#8fa080;
    --btnText:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background: radial-gradient(circle at 50% 35%, var(--bg) 0%, var(--bg) 45%, var(--bg2) 100%);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Helvetica Neue", sans-serif;
    touch-action: manipulation;
  }
  .app{height:100svh;min-height:100vh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 22px calc(env(safe-area-inset-bottom) + 14px);}
  .top{height:44px;display:flex;align-items:center;justify-content:flex-end;font-size:24px;font-weight:500;letter-spacing:.04em;color:rgba(45,48,43,.78);}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;}
  .symbol{
    width:100%;text-align:center;line-height:1;
    font-family: Georgia, "Times New Roman", "Charis SIL", "Doulos SIL", "Arial Unicode MS", serif;
    font-weight:400;
    font-size: clamp(120px, 34vw, 360px);
    letter-spacing:-0.025em;
    color:rgba(30,32,29,.92);
    user-select:none;
    transform: translateY(-2vh);
    white-space:nowrap;
  }
  .symbol.long{font-size:clamp(84px, 24vw, 250px);letter-spacing:-.035em;}
  .hint{text-align:center;color:var(--muted);font-size:18px;margin-bottom:18px;}
  .bar{display:grid;grid-template-columns:1fr 2fr 1fr;gap:14px;align-items:center;}
  button{border:0;border-radius:24px;background:rgba(143,160,128,.88);color:var(--btnText);font-size:22px;padding:16px 14px;font-weight:500;box-shadow:0 10px 24px rgba(55,70,45,.18);}
  .mini{background:transparent;color:var(--muted);box-shadow:none;font-size:28px;padding:12px 6px;}
  .status{text-align:center;color:var(--muted);font-size:16px;height:24px;margin-top:10px;}
  .done .symbol{opacity:.92;}
  @media (orientation: landscape){
    .app{padding:18px 28px 14px;}
    .top{height:30px;font-size:20px;}
    .symbol{font-size:clamp(100px, 30vh, 260px);transform:none;}
    .symbol.long{font-size:clamp(74px, 24vh, 210px);}
    .hint{font-size:15px;margin-bottom:6px;}
    .bar{max-width:620px;width:80%;align-self:center;}
    button{font-size:18px;padding:11px 12px;}
    .mini{font-size:24px;}
    .status{font-size:14px;margin-top:4px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><span id="counter">0 / 54</span></div>
  <div class="stage" id="stage"><div class="symbol" id="symbol">点一下开始</div></div>
  <div class="hint">点屏幕 / 按空格 / 按右方向键：下一个</div>
  <div class="bar">
    <button class="mini" id="shuffleBtn" title="随机重洗">⇄</button>
    <button id="againBtn">开始</button>
    <button class="mini" id="listBtn" title="查看全部">☰</button>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
const symbols = [
  "i","ɪ","e","ɛ","æ","ɜr","ə","ər","ʌ","u","ʊ","o","ɔ","ɑ","aɪ","aʊ","ɔɪ","ɪr","ʊr","ɑr","aɪr","ɛr","ɔr","jʊr","aʊr",
  "p","b","t","d","k","ɡ","m","n","ŋ","l","w","hw","j","r","θ","ð","s","z","ʃ","ʒ","f","v","h","tʃ","dʒ","tr","dr","ts","dz"
];
let deck=[], index=-1, showingList=false;
const symbolEl=document.getElementById('symbol');
const counterEl=document.getElementById('counter');
const statusEl=document.getElementById('status');
const againBtn=document.getElementById('againBtn');
const app=document.getElementById('app');
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function newRound(){
  deck=shuffle(symbols); index=-1; showingList=false; app.classList.remove('done'); statusEl.textContent=''; againBtn.textContent='再来一次'; next();
}
function render(){
  const s = index>=0 && index<deck.length ? deck[index] : '点一下开始';
  symbolEl.textContent=s;
  symbolEl.className='symbol' + (s.length>=3 ? ' long' : '');
  counterEl.textContent = `${Math.max(index+1,0)} / ${deck.length || symbols.length}`;
}
function next(){
  if(showingList){showingList=false; render(); return;}
  if(deck.length===0){newRound(); return;}
  if(index < deck.length-1){ index++; render(); statusEl.textContent=''; }
  else { statusEl.textContent='已完成一轮，点“再来一次”重新随机。'; app.classList.add('done'); }
}
function showList(){
  showingList=true;
  symbolEl.className='symbol long';
  symbolEl.style.fontSize='clamp(22px, 6vw, 44px)';
  symbolEl.style.lineHeight='1.55';
  symbolEl.style.whiteSpace='normal';
  symbolEl.textContent=symbols.join('   ');
  statusEl.textContent='再次点屏幕返回当前音标。';
}
function restoreSymbolStyle(){symbolEl.style.fontSize=''; symbolEl.style.lineHeight=''; symbolEl.style.whiteSpace='nowrap';}
document.getElementById('stage').addEventListener('click',()=>{restoreSymbolStyle(); next();});
againBtn.addEventListener('click',(e)=>{e.stopPropagation(); restoreSymbolStyle(); newRound();});
document.getElementById('shuffleBtn').addEventListener('click',(e)=>{e.stopPropagation(); restoreSymbolStyle(); newRound();});
document.getElementById('listBtn').addEventListener('click',(e)=>{e.stopPropagation(); showList();});
document.addEventListener('keydown',(e)=>{ if([' ','ArrowRight','Enter'].includes(e.key)){e.preventDefault(); restoreSymbolStyle(); next();} });
render();
</script>
</body>
</html>
